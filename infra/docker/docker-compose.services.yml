# The Setu services as real processes, one container each, behind the gateway. An overlay on docker-compose.yml (which has the databases, the
# broker and the observability stack); run both:
#
#   docker build -f backend/Dockerfile -t setu/backend:dev .
#   docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.services.yml up -d
#
# Why it exists: on the Windows development machine no embedded server, Netty or JDK HTTP client runs reliably (a JDK NIO defect), so the
# distributed layout had only ever been verified in-process. On Linux, in containers, it runs as designed. See docs/contracts/containers.md.
#
# One image (setu/backend) for all of them; SETU_MAIN says which service a container is. The core process holds the modules not yet extracted and
# is the only one that migrates the database, so everything else waits for it to be healthy.

x-java: &java
  JAVA_OPTS: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"

# What every service needs to find the rest of the platform. Names are the compose service names.
x-common: &common
  <<: *java
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${SETU_DB_NAME:-setu_demo}
  DB_USER: ${POSTGRES_USER:-setu}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
  # the pool rule of docs/contracts/performance.md: threads x 2 + 16 <= pool; and ten pools must fit the server's 300 connections
  SERVER_MAX_THREADS: "8"
  DB_POOL_SIZE: "32"
  DB_POOL_MIN_IDLE: "4"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # tokens are signed by Identity alone and verified by everyone else against its published keys
  APP_SECURITY_JWT_JWKS_URI: http://identity:8081/.well-known/jwks.json
  # calls the gateway never routes: Academic confirms a guardian's grant, the data services answer the advisor's tool calls
  SETU_INTERNAL_TOKEN: ${SETU_INTERNAL_TOKEN:?run infra/docker/README.md "Containerised services" first}
  SETU_GUARDIAN_VERIFY_URL: http://academic:8082
  APP_METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
  APP_FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5180}
  # traces to Tempo and logs to Loki, over OTLP, when they are in the stack (they are in docker-compose.yml)
  OTEL_TRACES_EXPORT_ENABLED: "true"
  OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
  OTEL_LOGS_EXPORT_ENABLED: "true"
  OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs

# Memory: measured under the demo workload, an idle service uses 270-450 MiB and Identity about 500 (password hashing needs memory). The limits are ceilings,
# not reservations; the whole stack, infrastructure included, is comfortable in 8 GB and wants 12 GB if everything peaks at once.
x-service: &service
  image: setu/backend:dev
  restart: unless-stopped
  stop_grace_period: 30s

services:
  # Creates the services' database once. Postgres' own init scripts only run for a brand-new data volume, and this stack's volume is not new.
  db-init:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    entrypoint: ["sh", "-c"]
    command:
      # on an empty volume the server first runs a temporary one that only listens on a local socket, then restarts for real: wait until it accepts network connections
      # (the healthcheck now checks that too, this is the second line of defence), or the first connect is refused and the whole stack never starts
      - >
        until pg_isready -h postgres -U ${POSTGRES_USER:-setu} -q; do sleep 2; done;
        psql -h postgres -U ${POSTGRES_USER:-setu} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '${SETU_DB_NAME:-setu_demo}'" | grep -q 1
        || psql -h postgres -U ${POSTGRES_USER:-setu} -d postgres -c "CREATE DATABASE ${SETU_DB_NAME:-setu_demo}"
    restart: "no"

  # Gives each service its own database login, able to use only the schemas that service owns (infra/db/roles/service-roles.sql). It has to wait for the core,
  # which creates the tables, and the services wait for it. Safe to run again: it converges. The password is one development value for every role here; the point
  # of the roles is what each may touch, not the secret (a real deployment sets SETU_SERVICE_DB_PASSWORD per environment).
  db-roles:
    image: pgvector/pgvector:pg16
    depends_on:
      core:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    volumes:
      - ../db/roles/service-roles.sql:/service-roles.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -v ON_ERROR_STOP=1 -h postgres -U ${POSTGRES_USER:-setu} -d ${SETU_DB_NAME:-setu_demo}
        -c "SET setu.role_password = '${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}'" -f /service-roles.sql
    restart: "no"

  # The Notification service's own database: a PostgreSQL server of its own, holding only the notification schema and the platform tables the service needs (its own outbox,
  # audit log and idempotency keys, and Modulith's event log). docs/contracts/data-ownership.md section 4a.
  postgres-notification:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: setu_notification
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    volumes:
      - setu_notification_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-setu} -d setu_notification"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Loads that server from the shared database the first time (the notification schema with its data, the platform tables without), checks every row count, and gives the
  # service its login. It waits for the core, which creates the tables. Safe to run again: a loaded database only has its login's grants re-applied.
  db-notification-init:
    image: pgvector/pgvector:pg16
    depends_on:
      core:
        condition: service_healthy
      postgres-notification:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      PG_USER: ${POSTGRES_USER:-setu}
      SRC_HOST: postgres
      SRC_DB: ${SETU_DB_NAME:-setu_demo}
      TGT_HOST: postgres-notification
      TGT_DB: setu_notification
      SETU_SERVICE_DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      # the version this database stood at when it was first split off, and the folder of the migrations that are its own from then on
      MIGRATIONS_DIR: /service-migrations
      SPLIT_BASELINE: "103"
    volumes:
      - ../db/split/provision-service-db.sh:/provision-service-db.sh:ro
      - ../db/roles/service-roles.sql:/service-roles.sql:ro
      - ../db/services/notification:/service-migrations:ro
    entrypoint: ["bash", "/provision-service-db.sh", "notification", "notification"]
    restart: "no"

  # The Attendance service's own database, the same shape as Notification's: a server of its own holding the attendance schema and the platform tables the service needs.
  # The core and the other services no longer read these tables; they ask the service (/internal/attendance/counts). docs/contracts/data-ownership.md section 4a.
  postgres-attendance:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: setu_attendance
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    volumes:
      - setu_attendance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-setu} -d setu_attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Loads that server from the shared database the first time, checks every row count, baselines its Flyway history and gives the service its login. Run it only while the
  # Attendance service is stopped (infra/db/README.md): a copy taken while it writes would miss what it writes next.
  db-attendance-init:
    image: pgvector/pgvector:pg16
    depends_on:
      core:
        condition: service_healthy
      postgres-attendance:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      PG_USER: ${POSTGRES_USER:-setu}
      SRC_HOST: postgres
      SRC_DB: ${SETU_DB_NAME:-setu_demo}
      TGT_HOST: postgres-attendance
      TGT_DB: setu_attendance
      SETU_SERVICE_DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      MIGRATIONS_DIR: /service-migrations
      SPLIT_BASELINE: "103"
    volumes:
      - ../db/split/provision-service-db.sh:/provision-service-db.sh:ro
      - ../db/roles/service-roles.sql:/service-roles.sql:ro
      - ../db/services/attendance:/service-migrations:ro
    entrypoint: ["bash", "/provision-service-db.sh", "attendance", "attendance"]
    restart: "no"

  # The Assessment service's own database, the same shape as Attendance's and Notification's. The core and the other services no longer read the assessment schema; they ask
  # the service (/internal/assessment/grades and /visible). docs/contracts/data-ownership.md sections 3a and 4d.
  postgres-assessment:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: setu_assessment
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    volumes:
      - setu_assessment_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-setu} -d setu_assessment"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Loads that server from the shared database the first time, checks every row count, baselines its Flyway history and gives the service its login. Run it only while the
  # Assessment service is stopped (infra/db/README.md): a copy taken while it writes would miss what it writes next.
  db-assessment-init:
    image: pgvector/pgvector:pg16
    depends_on:
      core:
        condition: service_healthy
      postgres-assessment:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      PG_USER: ${POSTGRES_USER:-setu}
      SRC_HOST: postgres
      SRC_DB: ${SETU_DB_NAME:-setu_demo}
      TGT_HOST: postgres-assessment
      TGT_DB: setu_assessment
      SETU_SERVICE_DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      MIGRATIONS_DIR: /service-migrations
      SPLIT_BASELINE: "103"
    volumes:
      - ../db/split/provision-service-db.sh:/provision-service-db.sh:ro
      - ../db/roles/service-roles.sql:/service-roles.sql:ro
      - ../db/services/assessment:/service-migrations:ro
    entrypoint: ["bash", "/provision-service-db.sh", "assessment", "assessment"]
    restart: "no"

  # The Learning service's own database, the same shape as Notification's, Attendance's and Assessment's. The core and the other services no longer read the learning schema; they
  # ask the service (/internal/learning/...). docs/contracts/data-ownership.md sections 3a and 4e.
  postgres-learning:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: setu_learning
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    volumes:
      - setu_learning_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-setu} -d setu_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Loads that server from the shared database the first time, checks every row count, baselines its Flyway history and gives the service its login. Run it only while the
  # Learning service is stopped (infra/db/README.md): a copy taken while it writes would miss what it writes next.
  db-learning-init:
    image: pgvector/pgvector:pg16
    depends_on:
      core:
        condition: service_healthy
      postgres-learning:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      PG_USER: ${POSTGRES_USER:-setu}
      SRC_HOST: postgres
      SRC_DB: ${SETU_DB_NAME:-setu_demo}
      TGT_HOST: postgres-learning
      TGT_DB: setu_learning
      SETU_SERVICE_DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      MIGRATIONS_DIR: /service-migrations
      SPLIT_BASELINE: "103"
    volumes:
      - ../db/split/provision-service-db.sh:/provision-service-db.sh:ro
      - ../db/roles/service-roles.sql:/service-roles.sql:ro
      - ../db/services/learning:/service-migrations:ro
    entrypoint: ["bash", "/provision-service-db.sh", "learning", "learning"]
    restart: "no"

  # The modules not yet extracted (record, risk, career, finance, onboarding) and the owner of the migrations. Verifies tokens like any other
  # service (remote), and seeds the demo college on an empty database.
  core:
    <<: *service
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 1600m
    ports: ["127.0.0.1:8083:8083"]
    # uploaded resume files: on a volume, not in the database
    volumes:
      - setu_resumes:/data/resumes
    environment:
      <<: *common
      # Notification has a database of its own now. The core still contains the notification module and would join the same Kafka group, and an event it handled would be
      # written to the shared database's old copy, where nobody reads it: so the core does not consume for Notification any more.
      APP_NOTIFICATION_CONSUMER_ENABLED: "false"
      # Attendance has a database of its own now: the risk engine, the AI advisor's attendance tool and Career's standing ask the service for attendance counts instead of
      # reading the shared database's old copy of the attendance schema.
      SETU_ATTENDANCE_URL: http://attendance:8086
      # Assessment has a database of its own too: grades, the names and weights of what they grade, and the visible assessments of a section (risk, the AI advisor, transcripts
      # and GPA) are asked of the service instead of read from the shared database's old copy of the assessment schema.
      SETU_ASSESSMENT_URL: http://assessment:8085
      # Learning has a database of its own too: a student's submission and lesson counts (risk), the published assignments and lessons of a section and the lessons a student has
      # completed (the AI advisor) are asked of the service instead of read from the shared database's old copy of the learning schema.
      SETU_LEARNING_URL: http://learning:8084
      APP_RESUMES_DIR: /data/resumes
      SETU_MAIN: com.setu.BackendApplication
      SERVER_PORT: "8083"
      APPLICATION_NAME: core
      # The core is the monolith: it never loads the remote verifier. It verifies the tokens Identity signs with Identity's PUBLIC key alone (the
      # "previous public keys" of a rotation), so the private signing key stays with the Identity service and nowhere else.
      JWT_PREVIOUS_PUBLIC_KEYS: ${JWT_PUBLIC_KEY:?run infra/docker/README.md "Containerised services" first}
      APP_DISCOVERY_SERVICE: core
      APP_DISCOVERY_ADVERTISE_URL: http://core:8083
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # A hosted NVIDIA model tried after the second Gemini model and before the local one. Empty key means off. Set in the git-ignored infra/docker/.env.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # How long the primary Gemini model may take before the next model is tried (default 40) and the second Gemini model (set it empty to skip that step, so a slow Gemini
      # hands over to the hosted fallback sooner). Both live in the git-ignored infra/docker/.env.
      AI_PRIMARY_TIMEOUT_SECONDS: ${AI_PRIMARY_TIMEOUT_SECONDS:-40}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL-gemini-3.5-flash}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      # Online fee payment (Razorpay). Empty means off: checkout answers 503 and the rest of Finance works as before. Set them in the git-ignored
      # infra/docker/.env, never in this file.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    healthcheck: &health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT} && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  identity:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
      db-roles: {condition: service_completed_successfully}
    mem_limit: 768m
    ports: ["127.0.0.1:8081:8081"]
    environment:
      <<: *common
      DB_USER: setu_identity
      DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      SETU_MAIN: com.setu.identity.IdentityServiceApplication
      SERVER_PORT: "8081"
      APP_DISCOVERY_ADVERTISE_URL: http://identity:8081
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run infra/docker/README.md "Containerised services" first}
      WEBAUTHN_RP_ID: localhost
    healthcheck: *health

  academic:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
      db-roles: {condition: service_completed_successfully}
    mem_limit: 640m
    ports: ["127.0.0.1:8082:8082"]
    environment:
      <<: *common
      DB_USER: setu_academic
      DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      SETU_MAIN: com.setu.academic.AcademicServiceApplication
      SERVER_PORT: "8082"
      APP_DISCOVERY_ADVERTISE_URL: http://academic:8082
    healthcheck: *health

  learning:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
      db-learning-init: {condition: service_completed_successfully}
    mem_limit: 640m
    ports: ["127.0.0.1:8084:8084"]
    environment:
      <<: *common
      DB_HOST: postgres-learning
      DB_NAME: setu_learning
      DB_USER: setu_learning
      DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      # migrates its own database at start-up, as Notification, Attendance and Assessment do: the platform tables' migrations and its own, never the monolith's
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: filesystem:../infra/db/platform,filesystem:../infra/db/services/learning
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-setu}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      SETU_MAIN: com.setu.learning.LearningServiceApplication
      SERVER_PORT: "8084"
      APP_DISCOVERY_ADVERTISE_URL: http://learning:8084
    healthcheck: *health

  assessment:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
      db-assessment-init: {condition: service_completed_successfully}
    mem_limit: 640m
    ports: ["127.0.0.1:8085:8085"]
    environment:
      <<: *common
      DB_HOST: postgres-assessment
      DB_NAME: setu_assessment
      DB_USER: setu_assessment
      DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      # migrates its own database at start-up, as Notification and Attendance do: the platform tables' migrations and its own, never the monolith's
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: filesystem:../infra/db/platform,filesystem:../infra/db/services/assessment
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-setu}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      SETU_MAIN: com.setu.assessment.AssessmentServiceApplication
      SERVER_PORT: "8085"
      APP_DISCOVERY_ADVERTISE_URL: http://assessment:8085
    healthcheck: *health

  attendance:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
      db-attendance-init: {condition: service_completed_successfully}
    mem_limit: 640m
    # the live attendance board is served here; clients reach it through the gateway (route attendance-live, /ws). The port stays published to
    # tell a gateway problem from a service problem (LIVE=ws://localhost:8086/ws node infra/scripts/smoke-websocket.js)
    ports: ["127.0.0.1:8086:8086"]
    environment:
      <<: *common
      DB_HOST: postgres-attendance
      DB_NAME: setu_attendance
      DB_USER: setu_attendance
      DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      # migrates its own database at start-up, as Notification does: the platform tables' migrations and its own, never the monolith's
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: filesystem:../infra/db/platform,filesystem:../infra/db/services/attendance
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-setu}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      SETU_MAIN: com.setu.attendance.AttendanceServiceApplication
      SERVER_PORT: "8086"
      APP_DISCOVERY_ADVERTISE_URL: http://attendance:8086
    healthcheck: *health

  notification:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
      db-notification-init: {condition: service_completed_successfully}
    mem_limit: 640m
    ports: ["127.0.0.1:8087:8087"]
    environment:
      <<: *common
      DB_HOST: postgres-notification
      DB_NAME: setu_notification
      DB_USER: setu_notification
      DB_PASSWORD: ${SETU_SERVICE_DB_PASSWORD:-setu_dev_password}
      # This service migrates its own database at start-up: the platform tables' migrations and its own, never the monolith's. Flyway uses the database owner's login (it has
      # to create things; the service's own login cannot), which on this server owns only this one database.
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_LOCATIONS: filesystem:../infra/db/platform,filesystem:../infra/db/services/notification
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-setu}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
      SETU_MAIN: com.setu.notification.NotificationServiceApplication
      SERVER_PORT: "8087"
      APP_DISCOVERY_ADVERTISE_URL: http://notification:8087
    healthcheck: *health

  # No datasource, by design: it reads facts through the gateway with the signed-in user's own token.
  ai:
    <<: *service
    depends_on:
      core: {condition: service_healthy}
    mem_limit: 512m
    ports: ["127.0.0.1:8088:8088"]
    environment:
      <<: *java
      SETU_MAIN: com.setu.aiexplain.AiServiceApplication
      SERVER_PORT: "8088"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_SECURITY_JWT_JWKS_URI: http://identity:8081/.well-known/jwks.json
      SETU_INTERNAL_TOKEN: ${SETU_INTERNAL_TOKEN:?run infra/docker/README.md "Containerised services" first}
      GATEWAY_URL: http://gateway:8080
      APP_METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      APP_DISCOVERY_ADVERTISE_URL: http://ai:8088
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_LOGS_EXPORT_ENABLED: "true"
      OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # A hosted NVIDIA model tried after the second Gemini model and before the local one. Empty key means off. Set in the git-ignored infra/docker/.env.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # How long the primary Gemini model may take before the next model is tried (default 40) and the second Gemini model (set it empty to skip that step, so a slow Gemini
      # hands over to the hosted fallback sooner). Both live in the git-ignored infra/docker/.env.
      AI_PRIMARY_TIMEOUT_SECONDS: ${AI_PRIMARY_TIMEOUT_SECONDS:-40}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL-gemini-3.5-flash}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
    healthcheck: *health

  # The one public address of the platform. No database, no business code.
  gateway:
    <<: *service
    depends_on:
      identity: {condition: service_healthy}
      academic: {condition: service_healthy}
    mem_limit: 512m
    ports: ["8080:8080"]
    environment:
      <<: *java
      SETU_MAIN: com.setu.gateway.GatewayApplication
      SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_SECURITY_JWT_JWKS_URI: http://identity:8081/.well-known/jwks.json
      APP_METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      GATEWAY_IDENTITY_URL: http://identity:8081
      GATEWAY_ACADEMIC_URL: http://academic:8082
      GATEWAY_CORE_URL: http://core:8083
      GATEWAY_LEARNING_URL: http://learning:8084
      GATEWAY_ASSESSMENT_URL: http://assessment:8085
      GATEWAY_ATTENDANCE_URL: http://attendance:8086
      GATEWAY_NOTIFICATION_URL: http://notification:8087
      GATEWAY_AI_URL: http://ai:8088
      OTEL_TRACES_EXPORT_ENABLED: "true"
      OTEL_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_LOGS_EXPORT_ENABLED: "true"
      OTEL_LOGS_ENDPOINT: http://loki:3100/otlp/v1/logs
    healthcheck: *health
