name: setu

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # every service has its own connection pool against this one server (docs/contracts/performance.md); the default of 100 is too few for ten
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-setu}
      POSTGRES_USER: ${POSTGRES_USER:-setu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-setu_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - setu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-setu} -d ${POSTGRES_DB:-setu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - setu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      # PLAINTEXT is what the host reaches (the mapped port); INTERNAL is what other containers reach, by the name they know the broker by.
      # A broker tells every client where to reconnect, so an address of localhost is useless to a container.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "SetuLocalDevClusterId1"
    volumes:
      - setu_kafka_data:/var/lib/kafka/data
    healthcheck:
      # Day 15: no healthcheck existed before — added so `docker compose up`
      # can express real startup ordering (`depends_on: condition:
      # service_healthy`) instead of the backend racing a not-yet-ready
      # broker. broker-api-versions.sh succeeds only once the broker is
      # actually accepting client connections, not just process-alive.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  # Observability: Prometheus reads the backend metrics, Grafana draws them (provisioned datasource + dashboard).
  # One-time setup:  pwsh infra/docker/observability/init-scrape-token.ps1   (creates the scrape token the backend requires)
  prometheus:
    image: prom/prometheus:v2.53.1
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/scrape-token.local:/etc/prometheus/scrape-token:ro
      - setu_prometheus_data:/prometheus

  # Traces and logs (Sprint 6C.1, docs/contracts/observability.md). The services send to these only when OTEL_TRACES_EXPORT_ENABLED /
  # OTEL_LOGS_EXPORT_ENABLED are true; otherwise nothing is sent anywhere and these simply sit idle.
  tempo:
    image: grafana/tempo:2.5.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      # OTLP over HTTP: where the services' spans go (OTEL_TRACES_ENDPOINT=http://localhost:4318/v1/traces)
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - setu_tempo_data:/var/tempo

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      # also OTLP log ingestion at /otlp/v1/logs (OTEL_LOGS_ENDPOINT=http://localhost:3100/otlp/v1/logs)
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - setu_loki_data:/loki

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Local development default; set GRAFANA_ADMIN_PASSWORD in infra/docker/.env to change it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - setu_grafana_data:/var/lib/grafana

volumes:
  setu_postgres_data:
  setu_redis_data:
  setu_kafka_data:
  setu_prometheus_data:
  setu_grafana_data:
  setu_tempo_data:
  setu_loki_data:
  # uploaded resume files (used by the core service in docker-compose.services.yml)
  setu_resumes:
  # the Notification service's own database server (docker-compose.services.yml)
  setu_learning_pg:
  setu_assessment_pg:
  setu_attendance_pg:
  setu_notification_pg:
