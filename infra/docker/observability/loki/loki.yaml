# Loki for local development: single process, filesystem storage, OTLP log ingestion enabled (the services push logs to
# http://loki:3100/otlp/v1/logs when OTEL_LOGS_EXPORT_ENABLED=true; trace_id and span_id arrive as structured metadata, which is how Grafana jumps
# from a log line to its trace). Retention one day. Not a production configuration.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 24h
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
