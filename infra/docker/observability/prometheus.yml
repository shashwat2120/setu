# Prometheus for local development. It scrapes every Setu service's Micrometer metrics every 15 seconds, by the name each container has on the
# compose network (docker-compose.services.yml); the services must have been given the same token as the file read below (METRICS_SCRAPE_TOKEN).
# A service only serves /actuator/prometheus to a request that carries the dedicated scrape token (shared.security.MetricsScrapeAuthFilter,
# the same filter in the monolith, Identity and every extracted service); the token is read from a file so it is never written into this config.
# Every metric carries an `application` label (the service's spring.application.name) and each target a `service` label, so a dashboard can
# say which service a number came from. See docs/contracts/observability.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The monolith (everything not extracted yet).
  - job_name: setu-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      # The core process of the containerised stack (docker-compose.services.yml). To scrape a backend run on the host instead (the dev bridge on this
      # Windows machine listens on 8089), use host.docker.internal:8089 here and for the services below.
      - targets: ['core:8083']
        labels:
          service: setu-backend

  # The extracted services, one target each (ports are the defaults of each service's entry point).
  - job_name: setu-services
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets: ['gateway:8080']
        labels: { service: gateway }
      - targets: ['identity:8081']
        labels: { service: identity }
      - targets: ['academic:8082']
        labels: { service: academic }
      - targets: ['learning:8084']
        labels: { service: learning }
      - targets: ['assessment:8085']
        labels: { service: assessment }
      - targets: ['attendance:8086']
        labels: { service: attendance }
      - targets: ['notification:8087']
        labels: { service: notification }
      - targets: ['ai:8088']
        labels: { service: ai }
