<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ar1b2436" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2436"/></marker><marker id="ar8a5d18" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5d18"/></marker></defs><rect width="1920" height="1080" fill="#eae7dd"/><rect x="0" y="0" width="1920" height="96" rx="0" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="60" y="62" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="42" font-weight="600" fill="#f1eee2" text-anchor="start">Setu — from sign-in to an explained risk</text><text x="1860" y="60" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="18" font-weight="400" fill="#d4a73d" text-anchor="end" letter-spacing="1.5">THE DEMO FLOW IN SEVEN STEPS</text><rect x="66" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#1b2436" stroke-width="3"/><rect x="66" y="150" width="222" height="44" rx="14" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><rect x="66" y="174" width="222" height="20" rx="0" fill="#1b2436" stroke="#1b2436" stroke-width="0"/><text x="177" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">EVERYONE</text><rect x="149" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="177" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">1</text><text x="177" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Sign in</text><text x="177" y="345" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">Passkey or password.</text><text x="177" y="368" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">The college is</text><text x="177" y="391" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">identified</text><text x="177" y="414" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">automatically.</text><path d="M292,320 L320,320" fill="none" stroke="#1b2436" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar1b2436)"/><rect x="324" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#8a5d18" stroke-width="3"/><rect x="324" y="150" width="222" height="44" rx="14" fill="#8a5d18" stroke="#8a5d18" stroke-width="2"/><rect x="324" y="174" width="222" height="20" rx="0" fill="#8a5d18" stroke="#8a5d18" stroke-width="0"/><text x="435" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">FACULTY</text><rect x="407" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="435" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">2</text><text x="435" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Start</text><text x="435" y="337" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">attendance</text><text x="435" y="376" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">A QR code appears</text><text x="435" y="399" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">and changes every</text><text x="435" y="422" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">few seconds.</text><path d="M550,320 L578,320" fill="none" stroke="#1b2436" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar1b2436)"/><rect x="582" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#2f6f63" stroke-width="3"/><rect x="582" y="150" width="222" height="44" rx="14" fill="#2f6f63" stroke="#2f6f63" stroke-width="2"/><rect x="582" y="174" width="222" height="20" rx="0" fill="#2f6f63" stroke="#2f6f63" stroke-width="0"/><text x="693" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">STUDENT</text><rect x="665" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="693" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">3</text><text x="693" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Scan the QR</text><text x="693" y="345" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">The scan is checked</text><text x="693" y="368" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">and the student is</text><text x="693" y="391" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">marked present.</text><path d="M808,320 L836,320" fill="none" stroke="#1b2436" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar1b2436)"/><rect x="840" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#2c4a7a" stroke-width="3"/><rect x="840" y="150" width="222" height="44" rx="14" fill="#2c4a7a" stroke="#2c4a7a" stroke-width="2"/><rect x="840" y="174" width="222" height="20" rx="0" fill="#2c4a7a" stroke="#2c4a7a" stroke-width="0"/><text x="951" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">SYSTEM</text><rect x="923" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="951" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">4</text><text x="951" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Live update</text><text x="951" y="345" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">The faculty screen</text><text x="951" y="368" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">updates instantly,</text><text x="951" y="391" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">with no refresh.</text><path d="M1066,320 L1094,320" fill="none" stroke="#1b2436" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar1b2436)"/><rect x="1098" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#8a5d18" stroke-width="3"/><rect x="1098" y="150" width="222" height="44" rx="14" fill="#8a5d18" stroke="#8a5d18" stroke-width="2"/><rect x="1098" y="174" width="222" height="20" rx="0" fill="#8a5d18" stroke="#8a5d18" stroke-width="0"/><text x="1209" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">FACULTY + SYSTEM</text><rect x="1181" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="1209" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">5</text><text x="1209" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Quiz and</text><text x="1209" y="337" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">grade</text><text x="1209" y="376" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">The quiz is</text><text x="1209" y="399" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">auto-graded and</text><text x="1209" y="422" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">saved as a new grade</text><text x="1209" y="445" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">version.</text><path d="M1324,320 L1352,320" fill="none" stroke="#1b2436" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar1b2436)"/><rect x="1356" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#2c4a7a" stroke-width="3"/><rect x="1356" y="150" width="222" height="44" rx="14" fill="#2c4a7a" stroke="#2c4a7a" stroke-width="2"/><rect x="1356" y="174" width="222" height="20" rx="0" fill="#2c4a7a" stroke="#2c4a7a" stroke-width="0"/><text x="1467" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">SYSTEM</text><rect x="1439" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="1467" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">6</text><text x="1467" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Risk check</text><text x="1467" y="345" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">Attendance, grades</text><text x="1467" y="368" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">and progress become</text><text x="1467" y="391" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">one reproducible</text><text x="1467" y="414" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">score.</text><path d="M1582,320 L1610,320" fill="none" stroke="#1b2436" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar1b2436)"/><rect x="1614" y="150" width="222" height="340" rx="14" fill="#ffffff" stroke="#2f6f63" stroke-width="3"/><rect x="1614" y="150" width="222" height="44" rx="14" fill="#2f6f63" stroke="#2f6f63" stroke-width="2"/><rect x="1614" y="174" width="222" height="20" rx="0" fill="#2f6f63" stroke="#2f6f63" stroke-width="0"/><text x="1725" y="180" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">AI</text><rect x="1697" y="212" width="56" height="56" rx="28" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="1725" y="250" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="#f1eee2" text-anchor="middle">7</text><text x="1725" y="306" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">Plain</text><text x="1725" y="337" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="middle">explanation</text><text x="1725" y="376" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">The student and</text><text x="1725" y="399" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">advisor see the</text><text x="1725" y="422" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">reasons, with</text><text x="1725" y="445" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="400" fill="#52596b" text-anchor="middle">sources.</text><rect x="66" y="540" width="1788" height="96" rx="14" fill="#1b2436" stroke="#1b2436" stroke-width="2"/><text x="960" y="582" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#d4a73d" text-anchor="middle" letter-spacing="2">On every step</text><text x="960" y="616" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#f1eee2" text-anchor="middle">permission is checked · each college’s data stays separate · every action is logged</text><text x="66" y="706" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1b2436" text-anchor="start">If a password is forgotten</text><rect x="66" y="736" width="400" height="140" rx="14" fill="#efe3c9" stroke="#8a5d18" stroke-width="2.5"/><text x="90" y="790" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="start">Enter your email</text><text x="90" y="826" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#52596b" text-anchor="start">the answer is the same for any</text><text x="90" y="851" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#52596b" text-anchor="start">address</text><path d="M470,806 L518,806" fill="none" stroke="#8a5d18" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar8a5d18)"/><rect x="522" y="736" width="400" height="140" rx="14" fill="#efe3c9" stroke="#8a5d18" stroke-width="2.5"/><text x="546" y="790" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="start">Get a 6-digit code</text><text x="546" y="826" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#52596b" text-anchor="start">valid 15 minutes, works once</text><path d="M926,806 L974,806" fill="none" stroke="#8a5d18" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar8a5d18)"/><rect x="978" y="736" width="400" height="140" rx="14" fill="#efe3c9" stroke="#8a5d18" stroke-width="2.5"/><text x="1002" y="790" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="start">Set a new password</text><text x="1002" y="826" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#52596b" text-anchor="start">5 wrong tries and the code locks</text><path d="M1382,806 L1430,806" fill="none" stroke="#8a5d18" stroke-width="4" stroke-linejoin="round" marker-end="url(#ar8a5d18)"/><rect x="1434" y="736" width="400" height="140" rx="14" fill="#efe3c9" stroke="#8a5d18" stroke-width="2.5"/><text x="1458" y="790" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#1b2436" text-anchor="start">All sessions end</text><text x="1458" y="826" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#52596b" text-anchor="start">the old sign-ins stop working</text><text x="960" y="1010" font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#52596b" text-anchor="middle">Super admin manages colleges, roles and the platform audit log.</text></svg>