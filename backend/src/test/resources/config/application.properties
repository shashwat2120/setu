# Loaded by every Spring test, IN ADDITION to src/main/resources/application.yml (this is a different location, classpath:/config/, so it adds
# to the main file instead of replacing it, which a same-named file next to it would).
#
# Chat runs on Gemini in the tests, like everywhere. Policy-search embeddings do not: Gemini's embedding API has a free-tier cap of 1,000
# requests a DAY, and every policy document a test creates is chunked and embedded, so a few runs of the suite would use it up and the
# semantic-search tests would then fail for a reason that has nothing to do with the code. The built-in local embedder needs nothing and is
# what these tests were written against. The one test that checks real Gemini embeddings (GeminiPolicySearchLiveTests, tagged live-gemini) asks
# for them explicitly and is skipped unless run on purpose.
app.ai.embedding.provider=local
