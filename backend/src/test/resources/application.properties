spring.ai.model.chat=ollama

app.notification.consumer.enabled=false
app.risk.consumer.enabled=false
app.enrollment.consumer.enabled=false

# The test suite and a running stack (docker-compose.services.yml, or the dev bridge) share one Kafka broker on this machine. Every Spring test context
# publishes its outbox rows to the real broker, so with the same topic names the tests' events reach the running stack's consumers: events for
# enrollments and students that do not exist in the stack's database, retried and dead-lettered. The tests publish under their own prefix.
app.outbox.topic-prefix=setu-test.
