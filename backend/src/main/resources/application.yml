spring:
  config:
    # Load ignored developer settings when Spring starts from the backend folder or repo root.
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:./backend/.env.local[.properties]

  application:
    # Each service sets APPLICATION_NAME in its entry point (a default for spring.application.name itself would be ignored: see
    # EntryPointDefaultsTests). It names the service in metrics (the `application` label), traces and logs.
    name: ${APPLICATION_NAME:setu-backend}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:setu}
    username: ${DB_USER:setu}
    password: ${DB_PASSWORD:setu_dev_password}
    hikari:
      # CONNECTION POOL SIZING, a correctness rule and not a tuning knob (docs/contracts/performance.md). A write that uses a nested
      # REQUIRES_NEW transaction (the insert guards that turn a lost uniqueness race into a clean answer: 43 classes) holds its outer connection
      # while the inner one is acquired, so one request in flight needs TWO connections. If more requests are in flight than half the pool,
      # every connection is held by an outer transaction waiting for an inner one, and all of them stall until the connection timeout (measured:
      # 20 simultaneous QR scans against the default pool of 10 stalled for 30 s). The rule that cannot deadlock:
      #     worker threads x 2 + background threads x 2 <= maximum-pool-size
      # i.e. server.tomcat.threads.max (below) x 2 + 16 (outbox publisher, schedulers, consumers) <= this. ConnectionPoolSizingTests enforces it.
      maximum-pool-size: ${DB_POOL_SIZE:64}
      # Connections kept ready. Opening one costs about 35 ms and Hikari opens them one at a time, so a burst of 24 simultaneous requests (a
      # classroom scanning a QR code) needing ~48 connections against a pool that had shrunk to 2 spent ~1.6 s just connecting (measured). 16 ready
      # connections per service, ten services, is 160 of the 300 the database server allows (docker-compose.yml).
      minimum-idle: ${DB_POOL_MIN_IDLE:16}

  flyway:
    # See infra/db/README.md — migrations live outside the backend module so
    # the schema is portable and reviewable independent of the Spring Boot app.
    # Note: spring-modulith-starter-jpa does NOT bundle its own migration for
    # the event_publication table (confirmed by inspecting the jar) — it's
    # provided here instead, in infra/db/migrations/V50, discovered as a real
    # gap during Day 2 runtime verification.
    locations: filesystem:../infra/db/migrations

  jpa:
    # Flyway is the *only* source of schema truth. Hibernate must never
    # create or alter tables — "validate" fails fast if an entity's mapping
    # ever drifts from what a migration actually created.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      # Day 14: AI endpoint rate limiting only — never a source of truth.
      # Port matches infra/docker/.env's REDIS_PORT (6380 by default on this
      # machine, since 6379 is already taken by an unrelated project's own
      # Redis — see that .env file's own comment).
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      client-type: jedis
      repositories:
        enabled: false

  ai:
    # Day 16 §ai-perf: which configured ChatModel auto-configuration wins (Spring AI's own
    # switch — see GoogleGenAiChatAutoConfiguration/OllamaChatAutoConfiguration, both
    # @ConditionalOnProperty(name = "spring.ai.model.chat", havingValue = <theirs>,
    # matchIfMissing = true) — with both starters now on the classpath this MUST be set
    # explicitly or both would try to activate).
    #
    # Gemini is the primary provider, for the running application and for every backend test alike (there is no test-scope
    # application.yml in this project; a same-named src/test/resources/application.yml was tried and reverted because Maven's
    # test classpath ordering makes it REPLACE this whole file for tests rather than merge with it, silently deleting
    # datasource/redis/kafka config). Ollama is the FALLBACK only: Gemini answers in a few seconds where the local model measured
    # ~150s/response on this dev machine, so nothing waits on Ollama unless Gemini itself fails.
    #
    # Without a GEMINI_API_KEY (a machine or CI run that has none) AiProviderSafetyPostProcessor switches the primary to Ollama for
    # that run and says so loudly, rather than failing to start. A present-but-wrong key starts normally and fails (and falls back)
    # at request time. AiChatService holds that runtime fallback FROM whichever is primary TO Ollama on provider failure,
    # independent of this switch (see AiChatConfig#fallbackChatClient). Set AI_PROVIDER=ollama to force the local model.
    model:
      chat: ${AI_PROVIDER:google-genai}
    # Spring AI retries a failed provider call itself (default: 10 attempts with a backoff that grows to minutes) before the exception ever reaches
    # AiChatService. That hides a Gemini outage behind minutes of silent retries and delays the fallback to Ollama, which AiChatService
    # already does, with its own budgets (app.ai.primary-timeout-seconds / request-timeout-seconds). So: one retry, quickly, and only for
    # transient failures (client errors such as a bad key or an exhausted quota are not retried at all); then the fallback decides.
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      on-client-errors: false
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    google:
      genai:
        # Gemini Developer API (api-key only) — vertex-ai stays unset/false, so no GCP
        # project/location/service-account is ever required.
        api-key: ${GEMINI_API_KEY:}
        embedding:
          # Embeddings for college-policy search (RAG). Same key as chat; used only when Gemini is the chat provider (see
          # AiProviderSafetyPostProcessor). 768 dimensions to match institution.policy_chunks.
          api-key: ${GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.8-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Never auto-pull a model at startup — this app assumes Ollama and
        # the configured model are already provisioned (see docs/ai-setup.md
        # equivalent in the Day 14 report); a missing model should fail the
        # chat call with a controlled error, not trigger a multi-GB download.
        pull-model-strategy: never
      embedding:
        options:
          model: ${EMBEDDING_OLLAMA_MODEL:nomic-embed-text}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2:3b}
          temperature: ${OLLAMA_TEMPERATURE:0.2}

  kafka:
    # Day 15: the outbox publisher's producer; the notification consumer's settings follow below.
    # Port matches infra/docker/.env's KAFKA_PORT (9093 by default on this
    # machine, since 9092 is already taken by an unrelated project's own
    # Kafka/Redpanda — same pattern as DB_PORT/REDIS_PORT).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Delivery guarantees stated rather than inherited from client defaults (docs/contracts/kafka-contracts.md): every in-sync replica
      # acknowledges, and the broker drops a retried duplicate of a record it already has. Together with the outbox this is at-least-once
      # delivery with no producer-side duplicates; the consumers' processed-event tables absorb the rest.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # Short, explicit timeouts: a Kafka outage must fail a publish attempt
        # within a few seconds, not block the scheduled poller (and every test
        # context that loads it) for the client library's multi-minute defaults.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 6000
    # The notification module's consumer (notification/infrastructure/kafka). A new group reads each topic from the start, so the
    # first run catches up on everything already published; offsets are then committed by the listener container after each record.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # 6C.1: a listener is a span, and it continues the trace named by the record's traceparent header (set by the outbox publisher from the
      # trace that wrote the event), so an event's consumers appear in the same trace as the request that caused it.
      observation-enabled: true
      # A topic that has not been created yet (nothing published for that aggregate so far) must not stop the application starting.
      missing-topics-fatal: false

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # at most this many requests are in flight at once; the rest wait in the accept queue (see the pool-sizing rule under spring.datasource.hikari).
      # The gateway and the AI service have no database and set their own, higher, value.
      max: ${SERVER_MAX_THREADS:24}

logging:
  pattern:
    # Day 15 §7: correlation id (see CorrelationIdFilter) in every log line, when present — blank outside an HTTP
    # request (e.g. the OutboxPublisher's own scheduled thread, which has no request to tie it to).
    # 6C.1: and the trace the line belongs to (traceId/spanId are set by tracing; blank outside a traced thread), so a log line can be found from a
    # trace in Grafana and the other way round.
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} [%X{correlationId}] [%X{traceId:-}-%X{spanId:-}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info, modulith, prometheus
  metrics:
    tags:
      # Each service sets spring.application.name, so every metric says which service it came from; the monolith stays "setu-backend".
      application: ${spring.application.name:setu-backend}
    distribution:
      # Histogram buckets for request latency, so Grafana can show p95 (see infra/docker/observability).
      percentiles-histogram:
        "[http.server.requests]": true
        "[setu.outbound]": true
  # Metrics are scraped by Prometheus and never pushed. Micrometer's OTLP registry is on the classpath (it comes with the OpenTelemetry
  # starter) and, left on, tries to push to localhost:4318 every minute and logs a warning each time when nothing listens there.
  otlp:
    metrics:
      export:
        enabled: false
  # 6C.1 (docs/contracts/observability.md). Every request, Kafka listener and observed outbound call is a span with a trace id that appears in the
  # log lines. Spans are only SENT anywhere when OTEL_TRACES_EXPORT_ENABLED=true (the compose stack's Tempo); logs likewise with
  # OTEL_LOGS_EXPORT_ENABLED=true (Loki's OTLP endpoint). Metrics are scraped by Prometheus, never pushed.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTEL_LOGS_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTEL_LOGS_ENDPOINT:http://localhost:3100/otlp/v1/logs}

app:
  metrics:
    # The one token Prometheus presents to read /actuator/prometheus (see MetricsScrapeAuthFilter). Never committed:
    # set METRICS_SCRAPE_TOKEN in the git-ignored backend/.env.local. Blank keeps the endpoint closed to everyone.
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  # The origin the frontend is actually served from — used only to build the password-reset link
  # (${app.frontend-base-url}/reset-password, the page where the emailed code is typed). Never hard-code localhost in a link a real email sends.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5180}
  email:
    # The reset email is sent over SMTP by SmtpEmailService, for example through Gmail with an app password.
    smtp:
      # Gmail: host smtp.gmail.com, port 587 (STARTTLS), username = the Gmail address, password = a 16-character Google
      # "app password" (needs 2-step verification on that account). Never committed: set in the git-ignored backend/.env.local.
      # Blank username or password means "not configured": SmtpEmailService then logs a warning and reports failure.
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USER:}
      password: ${SMTP_PASSWORD:}
      # Blank means "send from the SMTP username". Gmail only allows its own address or a verified alias here.
      from-address: ${SMTP_FROM_ADDRESS:}
      from-name: ${MAIL_FROM_NAME:Setu College}
    preview:
      # Off by default — never true in production. Opt in only via the gitignored backend/.env.local's
      # EMAIL_PREVIEW_ENABLED for a local demo/review run where the reviewer's own inbox isn't reachable
      # (e.g. Gmail blocked on a locked-down network): SmtpEmailService then ALSO writes the exact rendered
      # reset email to a local file, in addition to (never instead of) the real send.
      enabled: ${EMAIL_PREVIEW_ENABLED:false}
      dir: ${EMAIL_PREVIEW_DIR:target/demo-email-outbox}
  demo-data:
    # Never true by default — only opted into for a local demo/review run (see DemoDataSeeder's own javadoc).
    # Never enabled in the test suite and never enabled in a real deployment.
    enabled: ${DEMO_DATA_ENABLED:false}
    # Blank by default (every seeded address stays @demo.setu.local — see DemoDataSeeder#demoEmail's own
    # javadoc). Set only via the gitignored backend/.env.local's DEMO_EMAIL_BASE for a local demo/review run
    # that needs forgot-password to deliver to a real inbox.
    email-base: ${DEMO_EMAIL_BASE:}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    topic-prefix: ${OUTBOX_TOPIC_PREFIX:setu.}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:5}
  attendance:
    # How long a scan token for a class attendance session stays valid, in seconds. 60 gives a person time to copy the session id and token across, or to scan
    # and submit on a slow connection, while a photo of the code is still useless after a minute. The instructor can rotate it at any time.
    qr-ttl-seconds: ${ATTENDANCE_QR_TTL_SECONDS:60}
  finance:
    razorpay:
      # Razorpay (https://razorpay.com). With no key id and secret, online payment is simply off: checkout answers 503 "not enabled" and the rest of
      # Finance works as before. Never committed: set in the git-ignored backend/.env.local (the dashboard issues rzp_test_ keys that move no
      # money, and rzp_live_ keys after KYC; this code does not care which it is given).
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # The secret typed into Razorpay's dashboard when the webhook is created. With none, the webhook endpoint refuses everything (503).
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
      timeout: ${RAZORPAY_TIMEOUT:10s}
  ai:
    # 60s default: a local small model doing tool-calling round trips genuinely takes 20-40s on typical dev
    # hardware (measured on this machine) — 30s was cutting real, successful calls off as false timeouts.
    request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:60}
    # How long the primary (Gemini) attempt may take before the local fallback is tried. Gemini normally answers in a few
    # seconds; when it hangs, waiting the full 60s above made every answer take ~98s. Capped at the value above.
    primary-timeout-seconds: ${AI_PRIMARY_TIMEOUT_SECONDS:40}
    # Tried before Ollama when the primary Gemini model fails (a 503 "high demand" on one model rarely hits another). Blank disables; ignored when equal to
    # the primary model. Needs a model this key can use: `GET /v1beta/models` lists them.
    gemini-fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
    # A hosted model on NVIDIA's OpenAI-compatible endpoint, tried after the second Gemini model and before the local one. Off without a key; the key is
    # never committed (git-ignored backend/.env.local and infra/docker/.env). Use a model that supports tool calling.
    nvidia:
      api-key: ${NVIDIA_API_KEY:}
      model: ${NVIDIA_MODEL:meta/llama-3.3-70b-instruct}
      base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
      timeout-seconds: ${NVIDIA_TIMEOUT_SECONDS:40}
    embedding:
      # Policy-search embeddings: auto (Gemini when Gemini is the chat provider, otherwise the built-in local one), gemini, ollama or local.
      provider: ${EMBEDDING_PROVIDER:auto}
    rate-limit:
      max-requests: ${AI_RATE_LIMIT_MAX_REQUESTS:20}
      window-seconds: ${AI_RATE_LIMIT_WINDOW_SECONDS:60}
  # The API gateway (com.setu.gateway.GatewayApplication, only active with setu.service=gateway; see docs/contracts/gateway.md).
  # Routes are plain configuration: the most specific matching path wins. GatewayRouteCoverageTests fails if a controller's path would reach a
  # service other than the one that owns its module, so moving a module into its own service means editing this block and keeping that test green.
  gateway:
    services:
      # Floor of known instances per service; running services also announce themselves in Redis (app.discovery.advertise-url) and are added.
      identity:
        instances: ${GATEWAY_IDENTITY_URL:http://localhost:8081}
      academic:
        instances: ${GATEWAY_ACADEMIC_URL:http://localhost:8082}
      learning:
        instances: ${GATEWAY_LEARNING_URL:http://localhost:8084}
      assessment:
        instances: ${GATEWAY_ASSESSMENT_URL:http://localhost:8085}
      attendance:
        instances: ${GATEWAY_ATTENDANCE_URL:http://localhost:8086}
      notification:
        instances: ${GATEWAY_NOTIFICATION_URL:http://localhost:8087}
      ai:
        instances: ${GATEWAY_AI_URL:http://localhost:8088}
      core:
        # Everything not extracted yet (record, risk, career, finance, the AI facts, onboarding).
        instances: ${GATEWAY_CORE_URL:http://localhost:8083}
    routes:
      - id: identity
        service: identity
        paths: ["/auth/**", "/identity/**", "/.well-known/**"]
        # Sign-in, refresh and reset cannot need a token; the step-up endpoints under /auth still demand one, enforced by Identity itself.
        public-paths: ["/auth/**", "/.well-known/jwks.json"]
      - id: academic
        service: academic
        paths: ["/institution/**", "/catalog/**", "/enrollment/**", "/directory/**", "/guardian-access/**"]
      - id: learning
        service: learning
        paths: ["/learning/**"]
      - id: assessment
        service: assessment
        paths: ["/assessment/**"]
      - id: attendance
        service: attendance
        paths: ["/attendance/**", "/staff-attendance/**"]
      - id: attendance-live
        service: attendance
        # The live attendance board: STOMP over WebSocket, relayed to the Attendance service (WebSocketRelayHandler). The handshake itself carries no
        # token, so it is public at the gateway; the STOMP CONNECT frame carries it and the service verifies it and authorizes every subscription.
        # An upgrade on any route that is not marked websocket is refused with 501.
        paths: ["/ws", "/ws/**"]
        public-paths: ["/ws", "/ws/**"]
        websocket: true
        rate-per-minute: 60
      - id: notification
        service: notification
        # Live delivery from the Notification service has no WebSocket route yet (/ws belongs to the live attendance board above).
        paths: ["/notifications/**"]
      - id: ai
        service: ai
        # The advisor only (/ai/**). Its facts (/ai-facts/**) are served by the service that holds the data, and fall to the core route.
        paths: ["/ai/**"]
        # An answer is slow by nature: the advisor may spend its own 60 s budget on the model, then on a fallback model. The 30 s every other route gets
        # would end such a call with a 504 while the advisor is still working. The streaming endpoint (/ai/chat/stream) is flushed to the client as it is produced.
        response-timeout: 120s
      - id: core
        service: core
        paths: ["/**"]
        # The payment provider's webhook carries no user token; the endpoint verifies the provider's signature itself.
        public-paths: ["/v3/api-docs/**", "/swagger-ui/**", "/swagger-ui.html", "/finance/provider-webhooks/**"]
    cors:
      allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5180}
    upstream:
      connect-timeout: 2s
      response-timeout: 30s
      quarantine: 15s
    limits:
      anonymous-per-minute: 120
      user-per-minute: 600
  security:
    jwt:
      # DEV-ONLY default (Base64 of "dev-only-secret-do-not-use-in-production-replace-me")
      # — every real deployment MUST override this via JWT_SECRET with a
      # random >=256-bit value. It no longer signs access tokens (see signing-key below); it only keys the reset-code HMAC.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi1yZXBsYWNlLW1l}
      # Access tokens are signed ES256. JWT_SIGNING_KEY = Base64 PKCS#8 EC P-256 private key; JWT_PREVIOUS_PUBLIC_KEYS = comma-separated
      # Base64 X.509 public keys of retired keys (rotation). Both come from backend/tools/generate-jwt-key.js. With no signing key an
      # EPHEMERAL one is generated at start-up (dev/tests only; logged as a warning).
      signing-key: ${JWT_SIGNING_KEY:}
      previous-public-keys: ${JWT_PREVIOUS_PUBLIC_KEYS:}
      issuer: ${JWT_ISSUER:setu}
      audience: ${JWT_AUDIENCE:setu-api}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 30
    argon2:
      # Benchmarked on dev hardware, not copied from a table — see
      # Argon2BenchmarkTests' javadoc for the measured run and reasoning.
      memory-kib: 65536
      iterations: 2
      parallelism: 1
      salt-length: 16
      hash-length: 32
      max-failed-attempts: 5
      lockout-minutes: 15
    webauthn:
      rp-id: ${WEBAUTHN_RP_ID:localhost}
      rp-name: Setu
      # Day 16 §frontend: this list is also SecurityConfig's CORS allow-list (not just WebAuthn's own relying-party
      # check) — :5180 added because that's the actual port this project's vite.config.ts configures, not Vite's
      # own default :5173.
      allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5180}
      challenge-ttl-seconds: 300
    password-reset:
      # MUST be false once the notification module can actually deliver the
      # reset token by email — see PasswordAuthController's javadoc.
      expose-token-for-dev: false
